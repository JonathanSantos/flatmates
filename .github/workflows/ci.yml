name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Formatação
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --release --all-targets --locked -- -D warnings
      - name: Testes
        run: cargo test --release --locked

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustup target add wasm32-unknown-unknown
      - name: Núcleo em WebAssembly
        run: cargo build --release --locked --lib --no-default-features --target wasm32-unknown-unknown
