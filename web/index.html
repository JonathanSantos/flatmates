<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flatmates: editor ao vivo</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1e2444; --muted: #6b7191; --line: #e3e1da;
    --accent: #ff6b5b; --warn-bg: #fff4d6; --warn-ink: #7a5200; --err-bg: #ffe3df; --err-ink: #8f1d10;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: Inter, -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12142b; --panel: #1a1d3a; --ink: #eef0ff; --muted: #9aa0c8; --line: #2b2f57;
            --warn-bg: #3a3214; --warn-ink: #ffd978; --err-bg: #41191a; --err-ink: #ffb0a6; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  nav { display: flex; gap: 6px; flex-wrap: wrap; }
  button { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  button:hover, button[aria-pressed="true"] { border-color: var(--ink); }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #time { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  main { display: grid; grid-template-columns: minmax(280px, 38%) 1fr; min-height: 0; }
  textarea { width: 100%; height: 100%; resize: none; border: 0; border-right: 1px solid var(--line); padding: 16px 18px;
             background: var(--panel); color: var(--ink); font: 12.5px/1.55 var(--mono); tab-size: 2; }
  #stage { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
  #view { display: grid; place-items: center; padding: 24px; min-height: 0; overflow: auto; }
  #view svg { max-width: 100%; max-height: 100%; height: auto; width: auto; border-radius: 10px; box-shadow: 0 1px 2px rgb(0 0 0 / .06), 0 12px 40px rgb(0 0 0 / .10); }
  #notes { margin: 0; padding: 0; list-style: none; max-height: 30vh; overflow: auto; }
  #notes li { padding: 8px 18px; border-top: 1px solid var(--line); font-size: 13px; }
  #notes .warn { background: var(--warn-bg); color: var(--warn-ink); }
  #notes .err { background: var(--err-bg); color: var(--err-ink); font-family: var(--mono); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 40vh 1fr; } textarea { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>Flatmates<span>.</span></h1>
  <nav id="examples" aria-label="Exemplos"></nav>
  <output id="time" aria-live="polite"></output>
</header>
<main>
  <textarea id="json" spellcheck="false" aria-label="Cena em JSON"></textarea>
  <section id="stage">
    <div id="view" aria-label="Ilustração gerada"></div>
    <ul id="notes"></ul>
  </section>
</main>
<script type="module">
const EXAMPLES = ["team", "office", "isometric", "custom", "brand", "night", "lounge", "pets", "remote-work"];
const $ = (id) => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();
let wasm;

function render(json) {
  const bytes = enc.encode(json);
  const input = wasm.flatmates_alloc(bytes.length);
  new Uint8Array(wasm.memory.buffer, input, bytes.length).set(bytes);
  const out = wasm.flatmates_render(input, bytes.length);
  wasm.flatmates_free(input, bytes.length);
  const len = new DataView(wasm.memory.buffer).getUint32(out, true);
  const text = dec.decode(new Uint8Array(wasm.memory.buffer, out + 4, len));
  wasm.flatmates_free(out, len + 4);
  return JSON.parse(text);
}

function note(kind, text) {
  const li = document.createElement("li");
  li.className = kind;
  li.textContent = text;
  $("notes").append(li);
}

function update() {
  const start = performance.now();
  const reply = render($("json").value);
  $("notes").replaceChildren();
  if (reply.error) {
    note("err", reply.error);
  } else {
    // O SVG vem do próprio gerador, a partir do JSON digitado aqui.
    $("view").innerHTML = reply.svg;
    reply.warnings.forEach((w) => note("warn", w));
  }
  $("time").textContent = `${(performance.now() - start).toFixed(1)} ms`;
}

async function load(name) {
  const res = await fetch(`../examples/${name}.json`);
  $("json").value = await res.text();
  for (const b of $("examples").children) b.setAttribute("aria-pressed", String(b.textContent === name));
  update();
}

try {
  ({ instance: { exports: wasm } } = await WebAssembly.instantiateStreaming(fetch("flatmates.wasm"), {}));
  for (const name of EXAMPLES) {
    const b = document.createElement("button");
    b.textContent = name;
    b.onclick = () => load(name);
    $("examples").append(b);
  }
  let timer;
  $("json").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(update, 120); });
  await load(EXAMPLES[0]);
} catch (e) {
  note("err", `Não consegui carregar flatmates.wasm. Rode scripts/build-web.sh e sirva a pasta do projeto por HTTP. (${e.message})`);
}
</script>
</body>
</html>
