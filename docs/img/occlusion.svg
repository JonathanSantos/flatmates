<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 470" width="1010" height="470" role="img" aria-label="Ordem de pintura por oclusão"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1e2444"/></marker><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7191"/></marker></defs><rect width="1010" height="470" rx="18" fill="#f7f6f2"/><text x="36" y="50" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1e2444" text-anchor="start" >Ordem de pintura por oclusão real</text><text x="36" y="76" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6b7191" text-anchor="start" >Profundidade do centro erra com peças grandes. Cada par é julgado onde se encontra na tela.</text><rect x="36" y="110" width="250" height="36" rx="10" fill="#ffffff" stroke="#dedbd2" stroke-width="1.5"/><text x="161.0" y="133" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e2444" text-anchor="middle" >par de peças</text><path d="M161 148L161 170" stroke="#1e2444" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="36" y="172" width="250" height="48" rx="10" fill="#ffffff" stroke="#dedbd2" stroke-width="1.5"/><text x="161.0" y="193" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e2444" text-anchor="middle" >os contornos se tocam na tela?</text><text x="161.0" y="210" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7191" text-anchor="middle" >contorno convexo, não só a caixa</text><path d="M288 196L330 196" stroke="#6b7191" stroke-width="2" fill="none" marker-end="url(#m)"/><text x="296" y="188" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7191" text-anchor="start" >não</text><rect x="332" y="178" width="150" height="36" rx="10" fill="#f7f6f2" stroke="#dedbd2" stroke-width="1.5"/><text x="407.0" y="201" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e2444" text-anchor="middle" >sem restrição</text><path d="M161 222L161 244" stroke="#1e2444" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="170" y="238" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7191" text-anchor="start" >sim</text><rect x="36" y="246" width="250" height="48" rx="10" fill="#ffffff" stroke="#dedbd2" stroke-width="1.5"/><text x="161.0" y="267" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e2444" text-anchor="middle" >uma é face plana?</text><text x="161.0" y="284" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7191" text-anchor="middle" >de que lado do plano está a outra</text><path d="M161 296L161 318" stroke="#1e2444" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="36" y="320" width="250" height="48" rx="10" fill="#ffffff" stroke="#dedbd2" stroke-width="1.5"/><text x="161.0" y="341" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e2444" text-anchor="middle" >cruza o plano?</text><text x="161.0" y="358" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6b7191" text-anchor="middle" >vale o ponto que cai sobre a face</text><path d="M161 370L161 392" stroke="#1e2444" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="36" y="394" width="250" heigh