[package]
name = "flatmates"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/JonathanSantos/flatmates"
description = "Gerador de ilustrações Corporate Memphis em SVG a partir de um JSON, com rig 3D e câmera única"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.25"
resvg = { version = "0.49", default-features = false, features = ["text"], optional = true }

[features]
default = ["png"]
# Rasterização para PNG. Desligue para compilar o núcleo para WebAssembly.
png = ["dep:resvg"]

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "flatmates"
path = "src/main.rs"
required-features = ["png"]

[[test]]
name = "render"
required-features = ["png"]

[profile.release]
opt-level = 3
lto = true
strip = true

[[test]]
name = "diagrams"
required-features = ["png"]
